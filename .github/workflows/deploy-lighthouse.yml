name: Deploy and Lighthouse

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: Next.js version used by both Next.js deployments
        required: true
        type: choice
        options:
          - 16.2.7
          - 16.3.3

permissions:
  contents: read

concurrency:
  group: deploy-lighthouse-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VINEXT_COMMIT: bdafcf41a77a68e5647be3f0fcf6ee4fed08ac78
      NEXT_VERSION: ${{ inputs.next_version }}
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CF_AUTH_CONFIG: ${{ secrets.CF_AUTH_CONFIG }}

    steps:
      - name: Checkout benchmark controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned vinext deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cloudflare/vinext
          ref: ${{ env.VINEXT_COMMIT }}
          path: deployment-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node and Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Record runner and tool versions
        shell: bash
        run: |
          DEPLOYMENT_ROOT="$RUNNER_TEMP/deployments"
          PACKAGE_ROOT="$RUNNER_TEMP/packages"
          RESULT_ROOT="$RUNNER_TEMP/deployment-results"
          export DEPLOYMENT_ROOT PACKAGE_ROOT RESULT_ROOT
          {
            echo "DEPLOYMENT_ROOT=$DEPLOYMENT_ROOT"
            echo "PACKAGE_ROOT=$PACKAGE_ROOT"
            echo "RESULT_ROOT=$RESULT_ROOT"
          } >> "$GITHUB_ENV"
          mkdir -p "$RESULT_ROOT" "$PACKAGE_ROOT"
          {
            echo "ImageOS=$ImageOS"
            echo "ImageVersion=$ImageVersion"
            uname -a
            lscpu
            node --version
            npm --version
            echo "Next.js=$NEXT_VERSION"
          } > "$RESULT_ROOT/runner.txt"
          git -C deployment-source rev-parse HEAD > "$RESULT_ROOT/source-commit.txt"
          git -C deployment-source rev-parse 'HEAD^{tree}' > "$RESULT_ROOT/source-tree.txt"
          test "$(git -C deployment-source rev-parse HEAD)" = "$VINEXT_COMMIT"

      - name: Install and pack the pinned vinext commit
        working-directory: deployment-source
        env:
          npm_config_ignore_pnpmfile: "true"
        shell: bash
        run: |
          vp install --frozen-lockfile --ignore-scripts
          git restore --source=HEAD -- pnpm-lock.yaml
          git diff --exit-code
          vp run build
          for package in types vinext cloudflare; do
            (cd "packages/$package" && vp pm pack --pack-destination "$PACKAGE_ROOT")
          done
          # vinext's prepack script intentionally replaces this tracked stub
          # inside the deployment checkout. Preserve the packed README, then
          # return the checkout to the pinned tree.
          git restore --source=HEAD -- packages/vinext/README.md
          node benchmarks/generate-app.mjs
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Prepare four separate deployment projects
        env:
          SOURCE_ROOT: ${{ github.workspace }}/deployment-source
        shell: bash
        run: |
          PACKED_FILES="$(find "$PACKAGE_ROOT" -maxdepth 1 -name '*.tgz' -printf '%f\n' | sort | jq -Rsc 'split("\n") | map(select(length > 0))')"
          export PACKED_FILES
          node scripts/prepare-deployments.mjs
          cp "$DEPLOYMENT_ROOT/deployment-manifest.json" "$RESULT_ROOT/deployment-manifest.json"

      - name: Install exact deployment trees
        shell: bash
        run: |
          for target in next-vercel next-cloudflare; do
            npm install --ignore-scripts=false --prefix "$DEPLOYMENT_ROOT/$target"
            npm ls --all --json --prefix "$DEPLOYMENT_ROOT/$target" > "$RESULT_ROOT/$target-npm-tree.json"
            cp "$DEPLOYMENT_ROOT/$target/package-lock.json" "$RESULT_ROOT/$target-package-lock.json"
          done
          for target in vinext-vercel vinext-cloudflare; do
            corepack pnpm@11.1.1 --dir "$DEPLOYMENT_ROOT/$target" install
            corepack pnpm@11.1.1 --dir "$DEPLOYMENT_ROOT/$target" list --recursive --depth Infinity --json > "$RESULT_ROOT/$target-pnpm-tree.json"
            cp "$DEPLOYMENT_ROOT/$target/pnpm-lock.yaml" "$RESULT_ROOT/$target-pnpm-lock.yaml"
          done

      - name: Install current deployment CLIs and restore Cloudflare auth
        shell: bash
        run: |
          npm install --global cf@0.8.0 pnpm@11.1.1 vercel@59.7.0
          mkdir -p "$HOME/.config/cloudflare/config"
          printf '%s' "$CF_AUTH_CONFIG" > "$HOME/.config/cloudflare/config/default.json"
          chmod 600 "$HOME/.config/cloudflare/config/default.json"
          {
            cf --version
            vercel --version
          } > "$RESULT_ROOT/deployment-cli-versions.txt"

      - name: Deploy Next.js to Vercel
        working-directory: ${{ runner.temp }}/deployments/next-vercel
        shell: bash
        run: |
          vercel link --yes --project next-vinext-bench-next --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN" 2>&1 | tee "$RESULT_ROOT/next-vercel-build.log"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" > "$RESULT_ROOT/next-vercel-url.txt"

      - name: Deploy vinext with Nitro to Vercel
        working-directory: ${{ runner.temp }}/deployments/vinext-vercel
        shell: bash
        run: |
          vercel link --yes --project next-vinext-bench-vinext --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN" 2>&1 | tee "$RESULT_ROOT/vinext-vercel-build.log"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" > "$RESULT_ROOT/vinext-vercel-url.txt"

      - name: Build and deploy Next.js with OpenNext to Cloudflare
        working-directory: ${{ runner.temp }}/deployments/next-cloudflare
        shell: bash
        run: |
          npm run build:cloudflare 2>&1 | tee "$RESULT_ROOT/next-cloudflare-adapter-build.log"
          cf build 2>&1 | tee "$RESULT_ROOT/next-cloudflare-cf-build.log"
          cf deploy --prebuilt 2>&1 | tee "$RESULT_ROOT/next-cloudflare-deploy.log"
          grep -Eo 'https://[^ ]+\.workers\.dev' "$RESULT_ROOT/next-cloudflare-deploy.log" | tail -1 | sed 's/[[:punct:]]$//' > "$RESULT_ROOT/next-cloudflare-url.txt"
          test -s "$RESULT_ROOT/next-cloudflare-url.txt"

      - name: Build and deploy vinext natively to Cloudflare
        working-directory: ${{ runner.temp }}/deployments/vinext-cloudflare
        shell: bash
        run: |
          rm cloudflare.config.ts wrangler.config.ts
          export CLOUDFLARE_API_TOKEN="$(jq -r .oauth_token "$HOME/.config/cloudflare/config/default.json")"
          corepack pnpm@11.1.1 exec vinext-cloudflare deploy 2>&1 | tee "$RESULT_ROOT/vinext-cloudflare-deploy.log"
          grep -Eo 'https://[^ ]+\.workers\.dev' "$RESULT_ROOT/vinext-cloudflare-deploy.log" | tail -1 | sed 's/[[:punct:]]$//' > "$RESULT_ROOT/vinext-cloudflare-url.txt"
          test -s "$RESULT_ROOT/vinext-cloudflare-url.txt"

      - name: Smoke test all deployment URLs
        shell: bash
        run: |
          for target in next-vercel vinext-vercel next-cloudflare vinext-cloudflare; do
            test -s "$RESULT_ROOT/$target-url.txt" || continue
            url="$(tail -1 "$RESULT_ROOT/$target-url.txt")"
            printf '%s=%s\n' "$target" "$url" >> "$RESULT_ROOT/urls.env"
            for attempt in {1..20}; do
              if curl --fail --silent --show-error --location "$url/" > "$RESULT_ROOT/$target-home.html"; then
                break
              fi
              test "$attempt" -lt 20
              sleep 3
            done
            grep -q 'Benchmark App' "$RESULT_ROOT/$target-home.html"
          done

      - name: Install pinned Chrome for Testing
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.1.0
        with:
          chrome-version: 152.0.7977.64

      - name: Run five Lighthouse rounds per deployment
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          mkdir -p "$RESULT_ROOT/lighthouse/raw"
          npm install --global lighthouse@13.4.1
          {
            lighthouse --version
            "$CHROME_PATH" --version
            echo 'preset=default mobile'
            echo 'category=performance'
          } > "$RESULT_ROOT/lighthouse/versions-and-config.txt"
          for round in {1..5}; do
            for target in next-vercel vinext-vercel next-cloudflare vinext-cloudflare; do
              grep -q "^$target=" "$RESULT_ROOT/urls.env" || continue
              url="$(cut -d= -f2- < <(grep "^$target=" "$RESULT_ROOT/urls.env"))"
              lighthouse "$url/" \
                --only-categories=performance \
                --output=json \
                --output-path="$RESULT_ROOT/lighthouse/raw/$target-round-$round.json" \
                --chrome-flags='--headless=new --no-sandbox' \
                --quiet
            done
          done
          target_count="$(wc -l < "$RESULT_ROOT/urls.env")"
          test "$(find "$RESULT_ROOT/lighthouse/raw" -name '*.json' | wc -l)" -eq "$((target_count * 5))"
          node scripts/summarize-lighthouse.mjs "$RESULT_ROOT/lighthouse/raw" | tee "$RESULT_ROOT/lighthouse/summary.stdout.json"

      - name: Save platform configuration and verify deployment source integrity
        if: always()
        shell: bash
        run: |
          mkdir -p "$RESULT_ROOT/platform-config"
          for target in next-vercel next-cloudflare vinext-vercel vinext-cloudflare; do
            cp "$DEPLOYMENT_ROOT/$target/package.json" "$RESULT_ROOT/platform-config/$target-package.json" 2>/dev/null || true
            cp "$DEPLOYMENT_ROOT/$target/vite.config.ts" "$RESULT_ROOT/platform-config/$target-vite.config.ts" 2>/dev/null || true
            cp "$DEPLOYMENT_ROOT/$target/wrangler.jsonc" "$RESULT_ROOT/platform-config/$target-wrangler.jsonc" 2>/dev/null || true
            cp "$DEPLOYMENT_ROOT/$target/cloudflare.config.ts" "$RESULT_ROOT/platform-config/$target-cloudflare.config.ts" 2>/dev/null || true
            cp "$DEPLOYMENT_ROOT/$target/wrangler.config.ts" "$RESULT_ROOT/platform-config/$target-wrangler.config.ts" 2>/dev/null || true
            cp "$DEPLOYMENT_ROOT/$target/open-next.config.ts" "$RESULT_ROOT/platform-config/$target-open-next.config.ts" 2>/dev/null || true
            cp "$DEPLOYMENT_ROOT/$target/pnpm-workspace.yaml" "$RESULT_ROOT/platform-config/$target-pnpm-workspace.yaml" 2>/dev/null || true
          done
          git -C deployment-source status --porcelain=v1 --untracked-files=no > "$RESULT_ROOT/source-status-after.txt"
          git -C deployment-source diff --binary > "$RESULT_ROOT/source-working-tree.diff"
          git -C deployment-source diff --cached --binary > "$RESULT_ROOT/source-index.diff"
          test ! -s "$RESULT_ROOT/source-status-after.txt"
          test ! -s "$RESULT_ROOT/source-working-tree.diff"
          test ! -s "$RESULT_ROOT/source-index.diff"

      - name: Upload raw deployment and Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-lighthouse-next-${{ env.NEXT_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-results
          if-no-files-found: error
          retention-days: 90
