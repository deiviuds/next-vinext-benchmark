<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Published and reproduced vinext benchmark results with Next.js 16.2.7 and 16.3.3."
    />
    <title>Performance benchmarks - vinext</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="https://vinext.dev/">vinext</a>
        <nav aria-label="Primary navigation">
          <a href="https://vinext.dev/compatibility">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 18 9 8l4 6 3-4 4 8M4 6h3v3H4z" /></svg>
            Compatibility
          </a>
          <a href="https://vinext.dev/benchmarks" aria-current="page">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 16a8 8 0 0 1 16 0M12 16l4-5M6 16h12" /></svg>
            Benchmarks
          </a>
          <a href="https://github.com/cloudflare/vinext">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-3 17.5v-2.2c-2 .4-2.5-.9-2.5-.9-.3-.9-.9-1.1-.9-1.1-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.8.9 2.2.7.1-.5.3-.9.6-1.1-1.6-.2-3.3-.8-3.3-3.6 0-.8.3-1.5.8-2-.1-.2-.4-1 .1-2 0 0 .7-.2 2.1.8a7.3 7.3 0 0 1 3.8-.1c1.4-1 2.1-.8 2.1-.8.5 1 .2 1.8.1 2 .5.5.8 1.2.8 2 0 2.8-1.7 3.4-3.3 3.6.3.2.5.7.5 1.3v2.8A9 9 0 0 0 12 3Z" /></svg>
            GitHub
          </a>
        </nav>
      </div>
    </header>

    <main>
      <div class="intro">
        <h1>Performance Dashboard</h1>
        <p>Benchmarks run on every merge to main. Comparing Next.js (Turbopack) vs vinext (Vite 8).</p>
      </div>

      <section aria-labelledby="results-heading">
        <div class="section-line">
          <div class="result-title">
            <h2 id="results-heading">Latest Performance Results</h2>
            <a class="commit" href="https://github.com/cloudflare/vinext/commit/bdafcf41a77a68e5647be3f0fcf6ee4fed08ac78">bdafcf4</a>
            <span class="date">8/26/2026</span>
          </div>
          <div class="tabs compact" data-tabs="timing" role="tablist" aria-label="Timing result set">
            <button type="button" role="tab" data-value="published" aria-selected="true">Published</button>
            <button type="button" role="tab" data-value="baseline" aria-selected="false">Our baseline</button>
            <button type="button" role="tab" data-value="updated" aria-selected="false">Next 16.3.3</button>
          </div>
        </div>
        <div id="timing-table"></div>

        <div class="section-line subheading">
          <div class="result-title">
            <h3>Bundle sizes</h3>
            <span class="table-note" id="bundle-note">vs prior 10-run median</span>
          </div>
          <div class="tabs compact" data-tabs="bundle" role="tablist" aria-label="Bundle result set">
            <button type="button" role="tab" data-value="published" aria-selected="true">Published</button>
            <button type="button" role="tab" data-value="baseline" aria-selected="false">Our baseline</button>
            <button type="button" role="tab" data-value="updated" aria-selected="false">Next 16.3.3</button>
          </div>
        </div>
        <div id="bundle-table"></div>

        <div class="section-line subheading deployment-heading">
          <div class="result-title">
            <h3>Deployment performance</h3>
          </div>
          <div class="tabs compact" data-tabs="deployment" role="tablist" aria-label="Deployment result set">
            <button type="button" role="tab" data-value="published" aria-selected="false" disabled>Published</button>
            <button type="button" role="tab" data-value="baseline" aria-selected="true">Next 16.2.7</button>
            <button type="button" role="tab" data-value="updated" aria-selected="false">Next 16.3.3</button>
          </div>
        </div>
        <div id="deployment-table"></div>
      </section>

      <section class="trends" aria-labelledby="trends-heading">
        <h2 id="trends-heading">Performance Trends</h2>
        <div class="tabs metrics" data-tabs="metrics" role="tablist" aria-label="Benchmark metric"></div>
        <div class="tabs datasets" data-tabs="chart-dataset" role="tablist" aria-label="Focused result set">
          <button type="button" role="tab" data-value="published" aria-selected="true">Published</button>
          <button type="button" role="tab" data-value="baseline" aria-selected="false">Our baseline</button>
          <button type="button" role="tab" data-value="updated" aria-selected="false">Next 16.3.3</button>
        </div>
        <div id="chart"></div>
      </section>

      <section class="trends" aria-labelledby="deployment-trends-heading">
        <h2 id="deployment-trends-heading">Deployment Trends</h2>
        <div class="tabs metrics" data-tabs="deployment-metrics" role="tablist" aria-label="Deployment metric"></div>
        <div class="tabs datasets" data-tabs="deployment-chart-dataset" role="tablist" aria-label="Focused deployment result set">
          <button type="button" role="tab" data-value="published" aria-selected="false" disabled>Published</button>
          <button type="button" role="tab" data-value="baseline" aria-selected="true">Next 16.2.7</button>
          <button type="button" role="tab" data-value="updated" aria-selected="false">Next 16.3.3</button>
        </div>
        <div id="deployment-chart"></div>
      </section>
    </main>
  </body>
</html>
